[package]
name = "klavaro-app"
description = "Aplicación de escritorio klavaro-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "klavaro-rs"
path = "src/main.rs"

[dependencies]
klavaro-core.workspace = true
klavaro-data.workspace = true
klavaro-store.workspace = true
klavaro-i18n.workspace = true
iced = { workspace = true, optional = true }
ureq = { version = "3", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["gui", "update"]
# Interfaz gráfica. Sin ella (`--no-default-features`) queda sólo la práctica en terminal,
# útil para compilar y probar sin descargar iced.
gui = ["dep:iced"]
# Aviso de versión nueva: consulta el último release en GitHub (ver `update.rs`).
update = ["dep:ureq", "dep:serde", "dep:serde_json"]

[lints]
workspace = true
