# Paquetes de cada versión. Al subir una etiqueta `v*` (por ejemplo `v0.1.0`) compila en los
# tres sistemas con tools/package.sh y crea un borrador de release en GitHub con los archivos.
# También se puede lanzar a mano (workflow_dispatch): entonces sólo deja los paquetes como
# artefactos del workflow, sin release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Paquete
        shell: bash
        run: tools/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: klavaro-rs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
